# Linker config de ld65 para Tipapita Adventure.
# Mapper 4 (MMC3), iNES 1.0, PRG-ROM 128 KB, CHR-ROM 128 KB (decidido en F0.2).
#
# Nota de hardware importante: en MMC3, la ventana $E000-$FFFF está SIEMPRE
# fija al último banco de 8 KB de PRG-ROM, sin importar el estado de encendido
# (indeterminado) de los registros del mapper. Por eso el código de arranque
# y los vectores de interrupción viven en PRG_FIXED/VECTORS, no en cualquier
# banco. Los demás bancos (PRG_RESERVED) no tienen código de bank-switching
# todavía — se dejan reservados/vacíos hasta que se necesiten (Fase 2+).

MEMORY {
    ZP:  file = "", start = $0000, size = $0100, type = rw;

    # Página $0200-$02FF: buffer de sombra de OAM. Debe empezar exactamente
    # en un límite de página (bajo = $00) porque la OAM DMA ($4014) copia
    # 256 bytes a partir de la página que se le indique.
    OAM: file = "", start = $0200, size = $0100, type = rw;

    HEADER: file = %O, start = $0000, size = $0010, fill = yes;

    # Bancos 0-6 de PRG-ROM (112 KB). Sin código de bank-switching todavía:
    # reservados para futuro contenido (motor, niveles, datos).
    PRG_RESERVED: file = %O, start = $8000, size = $1C000, fill = yes, fillval = $FF;

    # Último banco de PRG-ROM (16 KB). $E000-$FFFF de esto es lo único
    # garantizado accesible desde el reset en hardware MMC3 real.
    PRG_FIXED: file = %O, start = $C000, size = $3FFA, fill = yes, define = yes;
    VECTORS:   file = %O, start = $FFFA, size = $0006, fill = yes;

    # CHR-ROM: 128 KB, sin tiles todavía (relleno en $00 = patrón en blanco).
    CHR: file = %O, start = $0000, size = $20000, fill = yes, fillval = $00;

    RAM: file = "", start = $0300, size = $0500, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,         type = zp,  optional = yes;
    OAM:      load = OAM,        type = bss, optional = yes, define = yes;
    HEADER:   load = HEADER,     type = ro;
    STARTUP:  load = PRG_FIXED,  type = ro,  define = yes;
    CODE:     load = PRG_FIXED,  type = ro,  define = yes, optional = yes;
    RODATA:   load = PRG_FIXED,  type = ro,  define = yes, optional = yes;
    VECTORS:  load = VECTORS,    type = ro;
    CHARS:    load = CHR,        type = ro,  optional = yes;
    BSS:      load = RAM,        type = bss, define = yes, optional = yes;
}
